<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denex - Join Now</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --denex-blue: #3B99FF; 
            --denex-light: #f0f7ff;
            --denex-white: #ffffff;
            --denex-red: #ff4757;
            --text-gray: #666;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--denex-white); margin: 0; overflow-x: hidden; color: #333; }

        /* --- LOGO --- */
        .logo-wrap { display: flex; flex-direction: column; align-items: center; margin: 40px 0 10px; }
        .logo-bubbles { position: relative; width: 80px; height: 70px; }
        .bubble-main { 
            position: absolute; width: 55px; height: 55px; background: var(--denex-blue); 
            border-radius: 50% 50% 0 50%; display: flex; align-items: center; justify-content: center; z-index: 2;
        }
        .bubble-sub { 
            position: absolute; width: 45px; height: 45px; background: #96C9FF; 
            border-radius: 50% 50% 50% 0; bottom: 0; right: 0; opacity: 0.7; z-index: 1;
        }
        .dots { display: flex; gap: 4px; }
        .dot { width: 6px; height: 6px; background: white; border-radius: 50%; }
        .logo-text { font-size: 32px; font-weight: 700; color: var(--denex-blue); margin-top: 5px; letter-spacing: -1px; }

        /* --- FORM --- */
        .container { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .form-group { width: 100%; max-width: 380px; margin-bottom: 12px; position: relative; }
        input { 
            width: 100%; padding: 18px; border-radius: 16px; border: 1.5px solid #eee; 
            background: #fafafa; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--denex-blue); background: #fff; box-shadow: 0 5px 15px rgba(59,153,255,0.05); }

        #ageBadge {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: var(--denex-blue); color: white; padding: 4px 10px;
            border-radius: 10px; font-size: 12px; font-weight: 700; display: none;
        }

        .next-btn {
            width: 100%; max-width: 380px; padding: 18px; background: var(--denex-blue);
            color: white; border: none; border-radius: 18px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .next-btn:disabled { background: #cbd5e0; cursor: not-allowed; transform: scale(0.98); }

        .login-link { margin-top: 25px; font-size: 14px; color: var(--text-gray); }
        .login-link b { color: var(--denex-blue); cursor: pointer; }

        /* --- MODAL & TOAST --- */
        #denexToast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 15px 25px; border-radius: 20px;
            z-index: 3000; transition: 0.5s var(--spring); font-weight: 600; width: 85%; text-align: center;
        }
        #denexToast.show { top: 30px; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 2000; display: none; flex-direction: column;
            padding: 30px 20px; animation: modalSlide 0.4s var(--spring);
        }
        @keyframes modalSlide { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .step-box { display: none; flex-direction: column; align-items: center; width: 100%; }
        .step-box.active { display: flex; }
    </style>
</head>
<body>

    <div id="denexToast">Message</div>

    <div class="container" id="mainView">
        <div class="logo-wrap">
            <div class="logo-bubbles">
                <div class="bubble-main"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
                <div class="bubble-sub"></div>
            </div>
            <div class="logo-text">Denex</div>
            <p style="color:var(--text-gray); margin: 5px 0 20px;">Connect. Chat. Share.</p>
        </div>

        <div class="form-group"><input type="text" id="fname" placeholder="First Name" oninput="checkInputs()"></div>
        <div class="form-group"><input type="text" id="lname" placeholder="Last Name" oninput="checkInputs()"></div>
        <div class="form-group">
            <input type="password" id="pass" placeholder="Password (6-10 chars)" oninput="validatePass()">
        </div>
        
        <div class="form-group">
            <label style="font-size: 12px; color: #999; margin-left: 10px;">Date of Birth</label>
            <div style="position:relative">
                <input type="date" id="dob" onchange="calculateAge()">
                <span id="ageBadge">0 yrs</span>
            </div>
        </div>

        <button class="next-btn" id="mainNextBtn" onclick="openStep('email_step')" disabled>Next Step</button>

        <div class="login-link">
            Already have an account? <b onclick="location.href='login.html'">Login</b>
        </div>
    </div>

    <div id="denexModal" class="modal">
        <div class="modal-nav" style="margin-bottom:20px;">
            <i class="fa-solid fa-arrow-left" onclick="closeModal()" style="color: var(--denex-blue); font-size: 20px;"></i>
        </div>

        <div id="email_step" class="step-box active">
            <h2 style="color:var(--denex-blue)">Email Security</h2>
            <p style="text-align:center; color:#666;">We need to verify your email to keep your account safe.</p>
            <div class="form-group"><input type="email" id="userEmail" placeholder="Email Address"></div>
            <button class="next-btn" id="sendBtn" onclick="handleSendOTP()">Get Verification Code</button>
        </div>

        <div id="profile_step" class="step-box">
            <h2 style="color:var(--denex-blue)">Final Touch</h2>
            <div style="width:100px; height:100px; border-radius:50%; background:var(--denex-light); border:2px dashed var(--denex-blue); display:flex; align-items:center; justify-content:center; margin:20px 0; position:relative;">
                <i class="fa-solid fa-camera" style="font-size:25px; color:var(--denex-blue)"></i>
                <input type="file" id="pic" accept="image/*" style="position:absolute; inset:0; opacity:0;">
            </div>
            <div class="form-group">
                <input type="text" id="uname" placeholder="Username (Optional)" style="text-transform: lowercase;">
            </div>
            <button class="next-btn" id="finishBtn" onclick="saveToDatabase()">Finish Registration</button>
        </div>
    </div>

    <script>
        const toast = document.getElementById('denexToast');
        
        let _supa;
        function initSupabase() {
            if (typeof DENEX_CONFIG !== 'undefined') {
                _supa = supabase.createClient(DENEX_CONFIG.SB_URL, DENEX_CONFIG.SB_KEY);
            }
        }
        initSupabase();
        
        function denexAlert(msg, isError = true) {
            toast.innerText = msg;
            toast.style.background = isError ? "var(--denex-red)" : "var(--denex-blue)";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function validatePass() {
            const passEl = document.getElementById('pass');
            const btn = document.getElementById('mainNextBtn');
            const val = passEl.value;

            if (val.length > 0 && (val.length < 6 || val.length > 10)) {
                passEl.style.borderColor = "var(--denex-red)";
                btn.setAttribute('pass-error', 'true');
            } else {
                passEl.style.borderColor = "#eee";
                btn.removeAttribute('pass-error');
            }
            checkInputs();
        }

        function checkInputs() {
            const f = document.getElementById('fname').value;
            const l = document.getElementById('lname').value;
            const p = document.getElementById('pass').value;
            const d = document.getElementById('dob').value;
            const btn = document.getElementById('mainNextBtn');
            
            const isAllFilled = f && l && p && d;
            const passValid = p.length >= 6 && p.length <= 10;
            const noErrors = !btn.getAttribute('age-error') && !btn.getAttribute('pass-error') && passValid;
            
            btn.disabled = !(isAllFilled && noErrors);
        }

        function calculateAge() {
            const dob = document.getElementById('dob').value;
            const badge = document.getElementById('ageBadge');
            const btn = document.getElementById('mainNextBtn');
            if(!dob) return;
            const age = new Date().getFullYear() - new Date(dob).getFullYear();
            badge.innerText = age + " yrs";
            badge.style.display = "block";

            if(age < 17) {
                btn.setAttribute('age-error', 'true');
                denexAlert("You must be at least 17 years old.");
                badge.style.background = "var(--denex-red)";
            } else {
                btn.removeAttribute('age-error');
                badge.style.background = "var(--denex-blue)";
            }
            checkInputs();
        }

        function openStep(stepId) {
            document.getElementById('denexModal').style.display = 'flex';
            document.querySelectorAll('.step-box').forEach(s => s.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
            
            if(stepId === 'profile_step') {
                document.getElementById('mainView').style.display = 'none';
            }
        }

        function closeModal() { 
            document.getElementById('denexModal').style.removeProperty('display');
            document.getElementById('mainView').style.display = 'flex';
        }

        async function handleSendOTP() {
            const email = document.getElementById('userEmail').value;
            const sendBtn = document.getElementById('sendBtn');

            if(!email.includes('@') || !email.includes('.')) return denexAlert("Invalid email address.");
            
            sendBtn.disabled = true;
            sendBtn.innerText = "Checking...";

            try {
                const { data: existingUser } = await _supa
                    .from('denex_profiles')
                    .select('email')
                    .eq('email', email)
                    .maybeSingle();

                if (existingUser) {
                    denexAlert("Email already exists. Please Login.");
                    sendBtn.disabled = false;
                    sendBtn.innerText = "Get Verification Code";
                    return;
                }

                localStorage.setItem('reg_fname', document.getElementById('fname').value);
                localStorage.setItem('reg_lname', document.getElementById('lname').value);
                localStorage.setItem('reg_pass', document.getElementById('pass').value);
                localStorage.setItem('reg_dob', document.getElementById('dob').value);
                localStorage.setItem('reg_email', email);

                const otp = DENEX_UTILS.generateOTP();
                localStorage.setItem('denex_otp', otp);

                await DENEX_UTILS.sendEmailOTP(email, otp);
                denexAlert("Code sent to your inbox!", false);
                setTimeout(() => { location.href = 'otp.html'; }, 1000);

            } catch (e) {
                denexAlert("Connection Error. Try again.");
                sendBtn.disabled = false;
                sendBtn.innerText = "Get Verification Code";
            }
        }

        async function saveToDatabase() {
            const finishBtn = document.getElementById('finishBtn');
            const usernameInput = document.getElementById('uname').value.trim().toLowerCase();
            finishBtn.disabled = true;
            finishBtn.innerText = "Saving Profile...";

            // Check username availability if provided
            if(usernameInput) {
                const { data: taken } = await _supa.from('denex_profiles')
                    .select('username').eq('username', usernameInput).maybeSingle();
                if(taken) {
                    denexAlert("Username already taken!");
                    finishBtn.disabled = false;
                    finishBtn.innerText = "Finish Registration";
                    return;
                }
            }

            const finalData = {
                first_name: localStorage.getItem('reg_fname'),
                last_name: localStorage.getItem('reg_lname'),
                email: localStorage.getItem('reg_email'),
                password: localStorage.getItem('reg_pass'),
                dob: localStorage.getItem('reg_dob'),
                username: usernameInput || null,
                is_verified: true
            };

            try {
                const file = document.getElementById('pic').files[0];
                if (file) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `avatar_${Date.now()}.${fileExt}`;
                    const filePath = `${fileName}`;

                    const { error: uploadError } = await _supa.storage
                        .from('avatars')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = _supa.storage.from('avatars').getPublicUrl(filePath);
                    finalData.avatar_url = urlData.publicUrl;
                }

                const { error: insertError } = await _supa
                    .from('denex_profiles')
                    .insert([finalData]);

                if (insertError) throw insertError;

                denexAlert("Welcome to Denex!", false);
                
                localStorage.removeItem('reg_fname');
                localStorage.removeItem('reg_lname');
                localStorage.removeItem('reg_pass');
                localStorage.removeItem('reg_dob');
                localStorage.removeItem('reg_email');
                localStorage.removeItem('denex_otp');

                setTimeout(() => { location.href = 'index.html'; }, 2000);

            } catch (err) {
                denexAlert(err.message || "Signup failed.");
                finishBtn.disabled = false;
                finishBtn.innerText = "Finish Registration";
            }
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('status') === 'verified') {
                // Restore values from localStorage
                document.getElementById('fname').value = localStorage.getItem('reg_fname') || '';
                document.getElementById('lname').value = localStorage.getItem('reg_lname') || '';
                document.getElementById('pass').value = localStorage.getItem('reg_pass') || '';
                document.getElementById('dob').value = localStorage.getItem('reg_dob') || '';
                document.getElementById('userEmail').value = localStorage.getItem('reg_email') || '';

                // Refresh validation states
                calculateAge();
                validatePass();
                checkInputs();
                
                // Move directly to the last step
                openStep('profile_step');
            }
        };
    </script>
</body>
</html>
