<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Denex - Chat</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --denex-blue: #3B99FF; 
            --denex-bg: #f0f2f5;
            --denex-gray: #8e8e93;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { 
            background: var(--denex-bg); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: -webkit-fill-available;
        }

        /* --- HEADER --- */
        header { background: var(--denex-blue); color: white; padding: 10px 15px; padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0; }
        .back-btn { font-size: 20px; cursor: pointer; padding: 5px; }
        .chat-user-info { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--denex-blue); display: flex; align-items: center; justify-content: center; font-weight: 700; position: relative; overflow: hidden; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot { width: 12px; height: 12px; background: #8e8e93; border: 2px solid var(--denex-blue); border-radius: 50%; position: absolute; bottom: 0; right: 0; transition: 0.3s; }
        .status-dot.active { background: #4cd137; }

        /* --- CHAT AREA --- */
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px; position: relative; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.1); transition: 0.2s; }
        .msg.sent { background: var(--denex-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.received { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .reply-ref { background: rgba(0,0,0,0.05); border-left: 3px solid var(--denex-blue); padding: 5px 8px; border-radius: 6px; margin-bottom: 5px; font-size: 12px; cursor: pointer; }
        .sent .reply-ref { background: rgba(255,255,255,0.2); border-left-color: #fff; color: #eee; }

        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 5px; cursor: pointer; }
        .msg-meta { align-self: flex-end; font-size: 10px; margin-top: 4px; display: flex; align-items: center; gap: 3px; opacity: 0.8; }
        .read-icon { font-size: 9px; }
        .received .read-icon { display: none; }

        /* --- PREVIEWS & INPUT WRAPPER --- */
        .bottom-wrap { 
            background: white; 
            border-top: 1px solid #ddd; 
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
            flex-shrink: 0; 
            z-index: 100;
        }
        #imgPreviewBar { display: none; padding: 10px; background: #fff; align-items: center; gap: 10px; border-bottom: 1px solid #eee; }
        #imgPreviewBar img { height: 60px; width: 60px; object-fit: cover; border-radius: 8px; }
        #replyPreview { display: none; background: #e1f0ff; padding: 8px 15px; border-left: 4px solid var(--denex-blue); margin-bottom: 5px; border-radius: 8px; font-size: 13px; position: relative; }

        .input-area { background: white; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .input-wrap { flex: 1; background: #f0f2f5; border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; }
        #msgInput { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; font-size: 16px; }

        /* --- FULLSCREEN IMAGE VIEWER --- */
        #imageOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; }
        #imageOverlay img { max-width: 95%; max-height: 85%; object-fit: contain; border-radius: 8px; }
        .close-overlay { position: absolute; top: 30px; right: 30px; color: white; font-size: 35px; cursor: pointer; }

        /* --- MENUS & MODALS --- */
        #actionMenu, #profileModal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        .menu-content, .modal-content { background: white; width: 85%; border-radius: 20px; padding: 15px; animation: popIn 0.3s var(--spring); }
        .emoji-bar { display: flex; justify-content: space-between; font-size: 24px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .menu-btn { width: 100%; padding: 12px; border: none; background: transparent; text-align: left; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        .modal-content { text-align: center; padding: 25px; }
        .modal-avatar-large { width: 100px; height: 100px; border-radius: 50%; background: white; color: var(--denex-blue); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; margin: 0 auto 15px; border: 4px solid var(--denex-blue); overflow: hidden; }
        .modal-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
        .block-btn { width: 100%; border: none; padding: 12px; border-radius: 12px; margin-top: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .btn-red { background: #ff4757; color: white; }
        .btn-gray { background: #8e8e93; color: white; }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <i class="fa-solid fa-arrow-left back-btn" onclick="location.href='index.html'"></i>
        <div class="chat-user-info" onclick="showProfile()">
            <div class="avatar-circle" id="headerAvatar">? <div class="status-dot" id="onlineDot"></div></div>
            <div>
                <div style="font-weight: 700;" id="headerName">Loading...</div>
                <div style="font-size: 11px; opacity: 0.8;" id="statusText">Offline</div>
            </div>
        </div>
    </header>

    <div id="chatBox"></div>

    <div id="imageOverlay" onclick="closeImageOverlay()">
        <i class="fa-solid fa-xmark close-overlay"></i>
        <img id="fullImg" src="">
    </div>

    <div class="bottom-wrap">
        <div id="imgPreviewBar">
            <img id="previewImg" src="">
            <div style="flex:1; font-size: 12px; color: var(--denex-gray)">Ready to send...</div>
            <i class="fa-solid fa-circle-xmark" onclick="cancelImg()" style="color:#ff4757; font-size:20px; cursor:pointer"></i>
        </div>

        <div id="replyPreview">
            <span id="replyText"></span>
            <i class="fa-solid fa-xmark" style="position: absolute; right: 10px; top: 8px; cursor:pointer" onclick="cancelReply()"></i>
        </div>

        <div class="input-area">
            <i class="fa-solid fa-image icon-btn" onclick="document.getElementById('imageInput').click()" style="color:var(--denex-blue); font-size: 20px; cursor: pointer;"></i>
            <input type="file" id="imageInput" hidden accept="image/*" onchange="previewImage(this)">
            <div class="input-wrap">
                <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
            </div>
            <i class="fa-solid fa-paper-plane" id="sendBtn" onclick="handleSend()" style="color:var(--denex-blue); font-size: 22px; cursor: pointer;"></i>
        </div>
    </div>

    <div id="actionMenu" onclick="closeMenu()">
        <div class="menu-content" onclick="event.stopPropagation()">
            <div class="emoji-bar">
                <span onclick="react('🙏')">🙏</span><span onclick="react('👍')">👍</span><span onclick="react('❤')">❤</span><span onclick="react('😂')">😂</span><span onclick="react('😭')">😭</span>
            </div>
            <button class="menu-btn" onclick="handleReplyFromMenu()"><i class="fa-solid fa-reply"></i> Reply</button>
            <button id="deleteOption" class="menu-btn" style="color:#ff4757" onclick="confirmDelete()"><i class="fa-solid fa-trash"></i> Delete Message</button>
        </div>
    </div>

    <div id="profileModal" onclick="closeProfile()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-avatar-large" id="modalAvatar">?</div>
            <h2 id="modalFullName" style="margin: 5px 0;">...</h2>
            <p id="modalUsername" style="color: var(--denex-gray); margin: 0; font-size: 16px;">@username</p>
            <button id="blockBtn" class="block-btn" onclick="toggleBlock()">
                <i class="fa-solid fa-ban"></i> <span>Block User</span>
            </button>
        </div>
    </div>

    <script>
        const _supa = supabase.createClient(DENEX_CONFIG.SB_URL, DENEX_CONFIG.SB_KEY);
        const me = JSON.parse(localStorage.getItem('denex_user'));
        const urlParams = new URLSearchParams(window.location.search);
        const otherUserId = urlParams.get('chat_id');
        
        let otherUser = null, iBlockedThem = false, pendingFile = null;
        let replyingToId = null, selectedMsgId = null, selectedMsgText = "", pressTimer, touchStart = 0;

        async function initChat() {
            if (!me || !otherUserId) return location.href = 'index.html';

            const { data: blocks } = await _supa.from('denex_blocks')
                .select('*')
                .or(`and(blocker_id.eq.${me.id},blocked_id.eq.${otherUserId}),and(blocker_id.eq.${otherUserId},blocked_id.eq.${me.id})`);
            
            const theyBlockedMe = blocks?.find(b => b.blocker_id == otherUserId);
            if (theyBlockedMe) {
                alert("User don't exist");
                return location.href = 'index.html';
            }

            iBlockedThem = blocks?.some(b => b.blocker_id == me.id);

            const { data: profile } = await _supa.from('denex_profiles').select('*').eq('id', otherUserId).single();
            if (!profile) return location.href = 'index.html';
            
            otherUser = profile;
            document.getElementById('headerName').innerText = profile.first_name;
            updateAvatar(document.getElementById('headerAvatar'), profile);
            
            markAsRead();
            loadMessages();
            subscribeToMessages();
            checkUserStatus();
            updateMyStatus();
            
            setInterval(checkUserStatus, 10000);
            setInterval(updateMyStatus, 30000);
        }

        async function markAsRead() {
            if (!me || !otherUserId) return;
            await _supa.from('denex_messages')
                .update({ is_read: true })
                .eq('sender_id', otherUserId)
                .eq('receiver_id', me.id)
                .eq('is_read', false);
        }

        async function updateMyStatus() {
            if (!me) return;
            await _supa.from('denex_profiles')
                .update({ last_login: new Date().toISOString() })
                .eq('id', me.id);
        }

        async function loadMessages() {
            const { data } = await _supa.from('denex_messages')
                .select('*, reply:reply_to_id(content, sender_id)')
                .or(`and(sender_id.eq.${me.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${me.id})`)
                .order('created_at', { ascending: true });

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            
            data.forEach(m => {
                const isMe = m.sender_id === me.id;
                const div = document.createElement('div');
                div.className = `msg ${isMe ? 'sent' : 'received'}`;
                div.id = `msg-${m.id}`;
                
                let html = '';
                if (m.reply) {
                    html += `<div class="reply-ref" onclick="scrollToMsg('${m.reply_to_id}')">
                        <small style="font-weight:bold">${m.reply.sender_id === me.id ? 'You' : otherUser.first_name}:</small><br>
                        ${m.reply.content ? m.reply.content.substring(0, 40) : '📷 Image'}
                    </div>`;
                }
                
                if (m.image_url) html += `<img src="${m.image_url}" class="msg-img" onclick="openImageOverlay('${m.image_url}')">`;
                if (m.content) html += `<span>${m.content}</span>`;
                
                const checkIcon = m.is_read ? 'fa-check-double' : 'fa-check';
                const checkStyle = m.is_read ? 'color: #fff' : 'opacity: 0.6';
                html += `<div class="msg-meta"><i class="fa-solid ${checkIcon} read-icon" style="${isMe ? checkStyle : ''}"></i></div>`;
                div.innerHTML = html;

                div.onmousedown = () => startPress(m.id, isMe, m.content);
                div.ontouchstart = (e) => { startPress(m.id, isMe, m.content); touchStart = e.touches[0].clientX; };
                div.onmouseup = () => clearTimeout(pressTimer);
                div.ontouchend = (e) => { 
                    clearTimeout(pressTimer);
                    if (e.changedTouches[0].clientX - touchStart > 80) triggerReply(m.id, m.content);
                };

                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startPress(id, isMe, text) {
            pressTimer = setTimeout(() => {
                selectedMsgId = id; selectedMsgText = text;
                document.getElementById('actionMenu').style.display = 'flex';
                document.getElementById('deleteOption').style.display = isMe ? 'flex' : 'none';
            }, 600);
        }

        async function confirmDelete() {
            if (confirm("Delete message?")) {
                await _supa.from('denex_messages').delete().eq('id', selectedMsgId);
                closeMenu();
                loadMessages();
            }
        }

        function triggerReply(id, text) {
            replyingToId = id;
            document.getElementById('replyPreview').style.display = 'block';
            document.getElementById('replyText').innerText = "Replying to: " + (text ? text.substring(0, 30) + "..." : "Image");
        }

        async function handleSend() {
            const content = document.getElementById('msgInput').value.trim();
            if (!content && !pendingFile) return;
            if (iBlockedThem) { alert("Unblock user to send messages."); return; }

            let uploadedUrl = null;
            if (pendingFile) {
                const fileName = `${me.id}/${Date.now()}_chat.png`;
                const { data, error } = await _supa.storage.from('denex_chat_media').upload(fileName, pendingFile);
                if (data) {
                    uploadedUrl = _supa.storage.from('denex_chat_media').getPublicUrl(fileName).data.publicUrl;
                }
            }

            await _supa.from('denex_messages').insert({ 
                sender_id: me.id, receiver_id: otherUserId, 
                content, image_url: uploadedUrl, reply_to_id: replyingToId,
                is_read: false 
            });

            document.getElementById('msgInput').value = '';
            cancelImg(); cancelReply();
        }

        function scrollToMsg(id) { 
            const el = document.getElementById(`msg-${id}`); 
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
        }

        function openImageOverlay(url) {
            document.getElementById('fullImg').src = url;
            document.getElementById('imageOverlay').style.display = 'flex';
        }

        function closeImageOverlay() { document.getElementById('imageOverlay').style.display = 'none'; }
        function cancelReply() { replyingToId = null; document.getElementById('replyPreview').style.display = 'none'; }
        function handleReplyFromMenu() { triggerReply(selectedMsgId, selectedMsgText); closeMenu(); }
        function closeMenu() { document.getElementById('actionMenu').style.display = 'none'; }
        function react(emoji) { document.getElementById('msgInput').value += emoji; closeMenu(); }

        function showProfile() {
            if(!otherUser) return;
            document.getElementById('modalFullName').innerText = `${otherUser.first_name} ${otherUser.last_name}`;
            document.getElementById('modalUsername').innerText = `@${otherUser.username}`;
            
            const mAvatar = document.getElementById('modalAvatar');
            if (otherUser.avatar_url) {
                mAvatar.innerHTML = `<img src="${otherUser.avatar_url}">`;
            } else {
                mAvatar.innerText = otherUser.first_name[0].toUpperCase();
            }

            const bBtn = document.getElementById('blockBtn');
            if (iBlockedThem) {
                bBtn.className = "block-btn btn-gray";
                bBtn.innerHTML = `<i class="fa-solid fa-rotate-left"></i> <span>Unblock User</span>`;
            } else {
                bBtn.className = "block-btn btn-red";
                bBtn.innerHTML = `<i class="fa-solid fa-ban"></i> <span>Block User</span>`;
            }
            document.getElementById('profileModal').style.display = 'flex';
        }

        async function toggleBlock() {
            if (iBlockedThem) {
                await _supa.from('denex_blocks').delete().eq('blocker_id', me.id).eq('blocked_id', otherUserId);
                iBlockedThem = false;
                alert("User Unblocked");
                showProfile(); 
            } else {
                if (confirm("Block this user?")) {
                    await _supa.from('denex_blocks').insert({ blocker_id: me.id, blocked_id: otherUserId });
                    location.href = 'index.html';
                }
            }
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                pendingFile = input.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('imgPreviewBar').style.display = 'flex';
                };
                reader.readAsDataURL(pendingFile);
            }
        }
        function cancelImg() { pendingFile = null; document.getElementById('imgPreviewBar').style.display = 'none'; document.getElementById('imageInput').value = ''; }
        function closeProfile() { document.getElementById('profileModal').style.display = 'none'; }
        function updateAvatar(element, user) {
            if (user.avatar_url) element.innerHTML = `<img src="${user.avatar_url}"><div class="status-dot" id="onlineDot"></div>`;
            else { 
                element.innerText = user.first_name ? user.first_name[0].toUpperCase() : '?'; 
                element.innerHTML += `<div class="status-dot" id="onlineDot"></div>`; 
            }
        }
        async function checkUserStatus() {
            const { data } = await _supa.from('denex_profiles').select('last_login').eq('id', otherUserId).single();
            if (data?.last_login) {
                const isOnline = (new Date() - new Date(data.last_login)) / 1000 / 60 < 2;
                document.getElementById('onlineDot').className = `status-dot ${isOnline ? 'active' : ''}`;
                document.getElementById('statusText').innerText = isOnline ? "Active Now" : "Offline";
            }
        }

        /* --- UPDATED REALTIME LOGIC --- */
        function subscribeToMessages() {
            _supa.channel('chat-room')
                .on('postgres_changes', { event: '*', table: 'denex_messages' }, (payload) => {
                    console.log("Database change:", payload);

                    // If a NEW message is sent to this chat
                    if (payload.eventType === 'INSERT') {
                        const m = payload.new;
                        if ((m.sender_id === me.id && m.receiver_id === otherUserId) || 
                            (m.sender_id === otherUserId && m.receiver_id === me.id)) {
                            
                            // Mark as read if I am the receiver
                            if (m.receiver_id === me.id) {
                                markAsRead();
                            }
                            loadMessages(); 
                        }
                    }

                    // If a message is UPDATED (e.g., someone read it)
                    if (payload.eventType === 'UPDATE') {
                        const m = payload.new;
                        // Find the message on screen and update the checkmark instantly
                        const msgEl = document.getElementById(`msg-${m.id}`);
                        if (msgEl && m.is_read) {
                            const icon = msgEl.querySelector('.read-icon');
                            if (icon) {
                                icon.classList.replace('fa-check', 'fa-check-double');
                                icon.style.color = "#fff"; 
                                icon.style.opacity = "1";
                            }
                        }
                    }
                    
                    // If a message is DELETED
                    if (payload.eventType === 'DELETE') {
                        loadMessages();
                    }
                })
                .on('postgres_changes', { event: 'UPDATE', table: 'denex_profiles', filter: `id=eq.${otherUserId}` }, () => {
                    checkUserStatus(); // Refresh green dot instantly
                })
                .subscribe();
        }

        initChat();
    </script>
</body>
</html>
