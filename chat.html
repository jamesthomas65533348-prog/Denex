<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Denex - Chat</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --denex-blue: #3B99FF; 
            --denex-bg: #f0f2f5;
            --denex-gray: #8e8e93;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            /* iPhone Glass Colors */
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        /* --- 1. GLOBAL & RESET --- */
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #msgInput {
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }

        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { 
            background: var(--denex-bg); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: -webkit-fill-available;
        }

        /* --- 2. HEADER & BOUNCY GLASS ISLAND --- */
        header { 
            background: var(--denex-blue); 
            color: white; 
            padding: 10px 15px; 
            padding-top: calc(10px + env(safe-area-inset-top)); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            z-index: 100; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            flex-shrink: 0;
            transition: 0.4s var(--spring);
        }

        .back-btn { font-size: 20px; cursor: pointer; padding: 5px; }
        .chat-user-info { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--denex-blue); display: flex; align-items: center; justify-content: center; font-weight: 700; position: relative; overflow: hidden; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot { width: 12px; height: 12px; background: #8e8e93; border: 2px solid var(--denex-blue); border-radius: 50%; position: absolute; bottom: 0; right: 0; transition: 0.3s; }
        .status-dot.active { background: #4cd137; }

        /* Premium Island Logic */
        #premiumIslandLayout { display: none; }
        .is-premium header { background: transparent !important; box-shadow: none !important; padding-top: calc(15px + env(safe-area-inset-top)); }
        .is-premium #standardBack, .is-premium #standardInfo { display: none !important; }
        .is-premium #premiumIslandLayout { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; }

        .island-pill {
            background: var(--glass-bg);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            color: #1c1c1e;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--glass-border);
            animation: islandBounce 0.6s var(--spring) forwards;
        }

        .back-island { width: 46px; height: 46px; cursor: pointer; }
        .name-island { flex: 1; height: 46px; padding: 0 18px; font-weight: 800; font-size: 14px; gap: 6px; cursor: pointer; }
        .avatar-island { width: 46px; height: 46px; cursor: pointer; padding: 4px; }
        .avatar-island .avatar-circle { width: 100%; height: 100%; border: none; }

        @keyframes islandBounce {
            0% { transform: scale(0.6) translateY(-20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* --- 3. CHAT AREA & MESSAGES --- */
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; position: relative; padding-bottom: 20px; }

        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px; position: relative; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.1); transition: transform 0.1s linear, opacity 0.3s; will-change: transform; }
        .msg.sent { background: var(--denex-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.received { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }

        .msg-img { width: 100%; border-radius: 10px; margin-bottom: 5px; cursor: pointer; }
        .msg-meta { align-self: flex-end; font-size: 10px; margin-top: 4px; display: flex; align-items: center; gap: 3px; opacity: 0.8; }
        .read-icon { font-size: 9px; }
        .received .read-icon { display: none; }

        .reply-ref { background: rgba(0,0,0,0.05); border-left: 3px solid var(--denex-blue); padding: 5px 8px; border-radius: 6px; margin-bottom: 5px; font-size: 12px; cursor: pointer; }
        .sent .reply-ref { background: rgba(255,255,255,0.2); border-left-color: #fff; color: #eee; }

        /* --- 4. TYPING INDICATOR --- */
        #typingIndicator {
            display: none; align-self: flex-start; background: white; padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 4px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            animation: dropIn 0.3s var(--spring);
        }
        .dots { display: flex; gap: 4px; }
        .dot { width: 7px; height: 7px; background: #8e8e93; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        /* --- 5. BOTTOM UI & PREVIEWS --- */
        .bottom-wrap { background: white; border-top: 1px solid #ddd; padding-bottom: calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0; z-index: 100; transition: 0.3s; }
        #imgPreviewBar { display: none; padding: 10px; background: #fff; align-items: center; gap: 10px; border-bottom: 1px solid #eee; }
        #imgPreviewBar img { height: 60px; width: 60px; object-fit: cover; border-radius: 8px; }
        #replyPreview { display: none; background: #e1f0ff; padding: 8px 15px; border-left: 4px solid var(--denex-blue); margin: 5px 10px; border-radius: 12px; font-size: 13px; position: relative; animation: dropIn 0.4s var(--spring); }

        .input-area { background: white; padding: 10px; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .input-wrap { flex: 1; background: #f0f2f5; border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; transition: 0.3s; border: 1px solid transparent; }
        #msgInput { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; font-size: 16px; }

        /* --- 6. MODALS & MENUS --- */
        #actionMenu, #profileModal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
        .menu-content, .modal-content { background: white; width: 85%; border-radius: 20px; padding: 15px; animation: popIn 0.3s var(--spring); }
        .emoji-bar { display: flex; justify-content: space-between; font-size: 24px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .menu-btn { width: 100%; padding: 12px; border: none; background: transparent; text-align: left; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .modal-content { text-align: center; padding: 25px; position: relative; overflow: hidden; }
        .modal-avatar-large { width: 100px; height: 100px; border-radius: 50%; background: white; color: var(--denex-blue); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; margin: 0 auto 15px; border: 4px solid var(--denex-blue); overflow: hidden; z-index: 2; position: relative; }
        .modal-avatar-large img { width: 100%; height: 100%; object-fit: cover; }

        .block-btn { width: 100%; border: none; padding: 12px; border-radius: 12px; margin-top: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; z-index: 2; position: relative; }
        .btn-red { background: #ff4757; color: white; }
        .btn-gray { background: #8e8e93; color: white; }

        /* --- 7. PREMIUM UI & BADGE (Scalloped Design) --- */
        .verified-badge {
            background: #0095f6; color: white; width: 16px; height: 16px; font-size: 9px;
            display: inline-flex; align-items: center; justify-content: center; position: relative;
            box-shadow: 0 0 8px rgba(0, 149, 246, 0.4); animation: shimmers 3s infinite;
            clip-path: polygon(100% 50%, 94.46% 65.45%, 80.9% 76.94%, 65.45% 80.9%, 50% 86.6%, 34.55% 80.9%, 19.1% 76.94%, 5.54% 65.45%, 0% 50%, 5.54% 34.55%, 19.1% 23.06%, 34.55% 19.1%, 50% 13.4%, 65.45% 19.1%, 80.9% 23.06%, 94.46% 34.55%);
        }
        /* Restore Badge Resizing */
        #headerBadge .verified-badge { border: 1.5px solid white; width: 14px; height: 14px; font-size: 8px; }
        #modalBadge .verified-badge { width: 22px; height: 22px; font-size: 11px; }

        .premium-bg-layer {
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(45deg, #3b99ff, #ffffff, #ff4757, #2ecc71, #f1c40f, #9b59b6);
            background-size: 400% 400%; animation: multiGradient 10s ease infinite; opacity: 0.2;
        }

        .premium-watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 42px; font-weight: 900; color: rgba(0,0,0,0.04); white-space: nowrap; pointer-events: none; z-index: 1;
        }

        /* --- 8. OVERLAYS & SYSTEM CARDS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 6000;
        }
        .modal-card {
            background: white; width: 85%; max-width: 320px; border-radius: 28px;
            padding: 25px; text-align: center; transform: scale(0.7); opacity: 0;
            transition: 0.4s var(--spring);
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: scale(1); opacity: 1; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btns button { flex: 1; padding: 14px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; }
        .btn-modal-cancel { background: #f1f3f5; color: #1c1c1e; }
        .btn-modal-confirm { background: #ff4757; color: white; }

        #imageOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; }
        #imageOverlay img { max-width: 95%; max-height: 85%; object-fit: contain; border-radius: 8px; }
        .close-overlay { position: absolute; top: 30px; right: 30px; color: white; font-size: 35px; cursor: pointer; }

        /* --- 9. ANIMATIONS --- */
        @keyframes dropIn { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes multiGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes shimmers { 0% { transform: scale(1) rotate(0deg); filter: brightness(1); } 50% { transform: scale(1.1) rotate(5deg); filter: brightness(1.2); } 100% { transform: scale(1) rotate(0deg); filter: brightness(1); } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideDownAvatar { from { transform: translateY(-150px) scale(0.5); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .is-premium .modal-avatar-large { animation: slideDownAvatar 0.6s var(--spring); }

        /* --- UTILS --- */
        .particle { position: absolute; pointer-events: none; border-radius: 50%; z-index: 1000; }
        .vibrate-error { animation: vibrateRed 0.3s linear; }
        @keyframes vibrateRed {
            0% { transform: translateX(0); border-color: #ff4757; }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body id="chatBody"> 
    
    <header id="mainHeader"> 
        <i class="fa-solid fa-arrow-left back-btn" id="standardBack" onclick="location.href='index.html'"></i>
        <div class="chat-user-info" id="standardInfo" onclick="showProfile()">
            <div class="avatar-circle" id="headerAvatar">? <div class="status-dot" id="onlineDot"></div></div>
            <div>
                <div style="font-weight: 700; display: flex; align-items: center; gap: 4px;">
                    <span id="headerName">Loading...</span>
                    <span id="headerBadge"></span>
                </div>
                <div style="font-size: 11px; opacity: 0.8;" id="statusText">Offline</div>
            </div>
        </div>

        <div id="premiumIslandLayout">
            <div class="island-pill back-island" onclick="location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
            <div class="island-pill name-island" onclick="showProfile()">
                <span id="headerNamePremium">Loading...</span>
                <span id="headerBadgePremium"></span>
            </div>
            <div class="island-pill avatar-island" onclick="showProfile()">
                <div class="avatar-circle" id="headerAvatarPremium">?</div>
            </div>
        </div>
    </header>

    <div id="chatBox"></div>

    <div id="typingIndicatorContainer" style="padding: 0 15px; flex-shrink: 0;">
        <div id="typingIndicator">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card">
            <h3 id="modalTitle">Action</h3>
            <p id="modalMsg">Are you sure?</p>
            <div class="modal-btns">
                <button class="btn-modal-cancel" onclick="closeConfirmModal()">Cancel</button>
                <button class="btn-modal-confirm" id="modalConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <div id="imageOverlay" onclick="closeImageOverlay()">
        <i class="fa-solid fa-xmark close-overlay"></i>
        <img id="fullImg" src="">
    </div>

    <div class="bottom-wrap">
        <div id="imgPreviewBar">
            <img id="previewImg" src="">
            <div style="flex:1; font-size: 12px; color: #8e8e93">Ready to send...</div>
            <i class="fa-solid fa-circle-xmark" onclick="cancelImg()" style="color:#ff4757; font-size:20px; cursor:pointer"></i>
        </div>

        <div id="replyPreview">
            <span id="replyText"></span>
            <i class="fa-solid fa-xmark" style="position: absolute; right: 10px; top: 8px; cursor:pointer" onclick="cancelReply()"></i>
        </div>

        <div class="input-area">
            <i class="fa-solid fa-image icon-btn" onclick="document.getElementById('imageInput').click()" style="color:var(--denex-blue); font-size: 20px; cursor: pointer;"></i>
            <input type="file" id="imageInput" hidden accept="image/*" onchange="previewImage(this)">
            <div class="input-wrap" id="mainInputWrap">
                <input type="text" id="msgInput" placeholder="Message..." autocomplete="on" spellcheck="true" inputmode="text">
            </div>
            <i class="fa-solid fa-paper-plane" id="sendBtn" onclick="handleSend()" style="color:var(--denex-blue); font-size: 22px; cursor: pointer;"></i>
        </div>
    </div>

    <div id="actionMenu" onclick="closeMenu()">
        <div class="menu-content" onclick="event.stopPropagation()">
            <div class="emoji-bar">
                <span onclick="react('🙏')">🙏</span><span onclick="react('👍')">👍</span><span onclick="react('❤')">❤</span><span onclick="react('😂')">😂</span><span onclick="react('😭')">😭</span>
            </div>
            <button class="menu-btn" onclick="handleReplyFromMenu()"><i class="fa-solid fa-reply"></i> Reply</button>
            <button id="deleteOption" class="menu-btn" style="color:#ff4757" onclick="confirmDelete()"><i class="fa-solid fa-trash"></i> Delete Message</button>
        </div>
    </div>

    <div id="profileModal" onclick="closeProfile()">
        <div class="modal-content" id="profileContent" onclick="event.stopPropagation()">
            <div id="premiumBg" class="premium-bg-layer" style="display: none;"></div>
            <div id="premiumWatermark" class="premium-watermark" style="display: none;">PREMIUM USER</div>
            <div class="modal-avatar-large" id="modalAvatar">?</div>
            <h2 style="margin: 5px 0; display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; z-index: 2;">
                <span id="modalFullName">...</span>
                <span id="modalBadge"></span>
            </h2>
            <p id="modalUsername" style="color: #8e8e93; margin: 0; font-size: 16px; position: relative; z-index: 2;">@username</p>
            <button id="blockBtn" class="block-btn" onclick="toggleBlock()" style="position: relative; z-index: 2;">
                <i class="fa-solid fa-ban"></i> <span>Block User</span>
            </button>
        </div>
    </div>

    <script src="chat.js"></script>
    <script>
        const syncObserver = new MutationObserver(() => {
            const name = document.getElementById('headerName').innerText;
            const badge = document.getElementById('headerBadge').innerHTML;
            const avatarHtml = document.getElementById('headerAvatar').innerHTML;
            const isPremium = badge.includes('verified-badge');

            document.getElementById('headerNamePremium').innerText = name;
            document.getElementById('headerBadgePremium').innerHTML = badge;
            
            const islandAvatar = document.getElementById('headerAvatarPremium');
            islandAvatar.innerHTML = avatarHtml;
            const dotInIsland = islandAvatar.querySelector('.status-dot');
            if(dotInIsland) dotInIsland.remove();

            if (isPremium) {
                document.body.classList.add('is-premium');
                const watermark = document.getElementById('premiumWatermark');
                const premiumBg = document.getElementById('premiumBg');
                if(watermark) watermark.style.display = 'block';
                if(premiumBg) premiumBg.style.display = 'block';
            } else {
                document.body.classList.remove('is-premium');
                const watermark = document.getElementById('premiumWatermark');
                const premiumBg = document.getElementById('premiumBg');
                if(watermark) watermark.style.display = 'none';
                if(premiumBg) premiumBg.style.display = 'none';
            }
        });

        syncObserver.observe(document.getElementById('headerBadge'), { childList: true, subtree: true, characterData: true });
        syncObserver.observe(document.getElementById('headerName'), { childList: true, characterData: true });
        syncObserver.observe(document.getElementById('headerAvatar'), { childList: true, subtree: true });
    </script>
</body>
</html>
