<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denex - Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --denex-blue: #3B99FF; 
            --denex-dark: #1c1c1e;
            --denex-gray: #8e8e93;
            --denex-bg: #ffffff;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* --- UI HYGIENE --- */
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
        }

        body { 
            background: var(--denex-bg); 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* --- GLASS HEADER --- */
        header {
            background: rgba(59, 153, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(59,153,255,0.15);
            z-index: 100;
        }

        /* DENEX LOGO STYLE */
        .denex-logo-box { display: flex; flex-direction: column; line-height: 1.1; }
        .denex-logo-box b { font-size: 20px; letter-spacing: 1px; }
        .denex-logo-box span { font-size: 10px; font-weight: 600; opacity: 0.8; text-transform: uppercase; letter-spacing: 1.5px; }

        .user-badge { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.3s var(--spring); }
        .user-badge:active { transform: scale(0.9); }
        .user-badge img { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid white; object-fit: cover; }
        .user-badge span { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .burger-menu { cursor: pointer; font-size: 24px; transition: 0.3s; }
        .burger-menu:active { transform: rotate(90deg) scale(0.8); }

        /* TYPING INDICATOR STYLE */
        .is-typing { color: var(--denex-blue) !important; font-style: italic; font-weight: 600 !important; }

        /* --- GUEST UI --- */
        #guestUI { display: none; padding: 40px 20px; text-align: center; flex: 1; animation: fadeIn 0.5s ease; }
        .guest-mode .burger-menu { display: none !important; }
        .guest-mode #guestUI { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-login { 
            background: var(--denex-blue); color: white; border: none; padding: 16px 40px; 
            border-radius: 20px; font-weight: 700; margin-top: 25px; transition: 0.3s var(--spring);
            box-shadow: 0 10px 20px rgba(59,153,255,0.2);
        }
        .btn-login:active { transform: scale(0.95); }

        /* --- SIDEBAR MENU --- */
        .dropdown {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: white; box-shadow: -15px 0 40px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; z-index: 1000;
            transition: 0.5s var(--spring);
            border-radius: 25px 0 0 25px;
        }
        .dropdown.active { right: 0; }
        .menu-header { padding: 40px 25px 20px; border-bottom: 1px solid #f0f0f0; }
        .dropdown-item {
            padding: 20px 25px; color: var(--denex-dark); font-weight: 600; font-size: 16px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s;
        }
        .dropdown-item:active { background: #f0f7ff; color: var(--denex-blue); padding-left: 35px; }
        .dropdown-item i { color: var(--denex-blue); width: 24px; font-size: 18px; }
        .logout { color: #ff4757 !important; border-top: 1px solid #f0f0f0; margin-top: auto; padding-bottom: 40px; }

        /* --- CHAT LIST ANIMATIONS --- */
        #chatList { flex: 1; overflow-y: auto; display: none; padding-bottom: 20px; }
        .chat-item { 
            display: flex; align-items: center; padding: 16px 20px; 
            border-bottom: 1px solid #f8f8f8; gap: 15px; cursor: pointer;
            transition: 0.3s var(--spring);
            animation: itemAppear 0.5s var(--spring) backwards;
        }
        @keyframes itemAppear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .chat-item:active { background: #f0f7ff; transform: scale(0.97); }

        .pfp-wrap { position: relative; width: 54px; height: 54px; }
        .pfp-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #f5f5f5; }
        
        .online-status { 
            position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; 
            background: #bdc3c7; border: 2.5px solid white; border-radius: 50%; 
        }
        .online-status.active { background: #4cd137; box-shadow: 0 0 10px rgba(76,209,55,0.4); }

        .unread-dot { 
            position: absolute; top: 0; right: 0; width: 15px; height: 15px; 
            background: #ff4757; border: 2.5px solid white; border-radius: 50%; 
        }
        .chat-info { flex: 1; }
        .chat-info h4 { margin: 0; font-size: 17px; color: var(--denex-dark); font-weight: 700; }
        .chat-info p { margin: 4px 0 0; font-size: 14px; color: var(--denex-gray); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

        /* --- FLOATING D --- */
        #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        .d-container { position: relative; width: 130px; height: 130px; margin-bottom: 25px; animation: float 3.5s ease-in-out infinite; }
        .d-symbol { font-size: 110px; font-weight: 900; color: var(--denex-blue); text-shadow: 0 10px 25px rgba(59,153,255,0.25); }
        .hand-wave { position: absolute; top: 10px; right: -5px; font-size: 45px; animation: wave 1.8s ease-in-out infinite alternate; transform-origin: bottom right; }

        @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
        @keyframes wave { 0% { transform: rotate(-10deg); } 100% { transform: rotate(30deg); } }

        /* --- SEARCH UPGRADE --- */
        .search-container { padding: 15px 20px; background: #fff; }
        .search-box { 
            background: #f1f3f5; border-radius: 16px; display: flex; 
            align-items: center; padding: 12px 18px; transition: 0.4s var(--spring);
            border: 1.5px solid transparent;
        }
        .search-box:focus-within { 
            background: #fff; border-color: var(--denex-blue); 
            transform: scale(1.02); box-shadow: 0 8px 25px rgba(59,153,255,0.1); 
        }
        .search-box input { 
            border: none; background: transparent; outline: none; width: 100%; 
            margin-left: 10px; font-size: 16px; font-weight: 500;
            user-select: text; -webkit-user-select: text;
        }

        /* --- STYLISH POPUPS --- */
        #denexAlert {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: white; padding: 16px 28px; border-radius: 24px;
            z-index: 5000; opacity: 0; visibility: hidden; transition: 0.4s var(--spring);
            font-weight: 600; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        #denexAlert.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 6000;
        }
        .modal-card {
            background: white; width: 85%; max-width: 320px; border-radius: 28px;
            padding: 25px; text-align: center; transform: scale(0.7); opacity: 0;
            transition: 0.4s var(--spring);
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: scale(1); opacity: 1; }
        .modal-card h3 { margin: 0; font-size: 19px; color: var(--denex-dark); font-weight: 800; }
        .modal-card p { color: var(--denex-gray); font-size: 15px; margin: 12px 0 25px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 14px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; }
        .btn-cancel { background: #f1f3f5; color: var(--denex-dark); }
        .btn-confirm { background: #ff4757; color: white; }
    </style>
</head>
<body id="appBody">

    <div id="denexAlert">Message</div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-card">
            <h3 id="modalTitle">Block User?</h3>
            <p id="modalMsg">Are you sure you want to block this user?</p>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-confirm" id="modalActionBtn">Block</button>
            </div>
        </div>
    </div>

    <header>
        <div class="denex-logo-box">
            <b>DENEX</b>
            <span>Messenger</span>
        </div>
        <div class="header-right">
            <div class="user-badge" id="topProfile" onclick="location.href='profile.html'">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" id="headAvatar">
                <span id="headUname">Guest</span>
            </div>
            <i class="fa-solid fa-bars burger-menu" onclick="toggleMenu(event)"></i>
        </div>
    </header>

    <div class="dropdown" id="userDropdown">
        <div class="menu-header"><h2 style="margin:0; color:var(--denex-blue); font-weight:800;">Denex</h2></div>
        <div class="dropdown-item" onclick="location.href='index.html'"><i class="fa-solid fa-comment"></i> Chats</div>
        <div class="dropdown-item" onclick="location.href='profile.html'"><i class="fa-solid fa-circle-user"></i> Profile</div>
        <div class="dropdown-item" onclick="location.href='setting.html'"><i class="fa-solid fa-gear"></i> Settings</div>
        <div class="dropdown-item logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: #8e8e93; font-size: 18px;"></i>
            <input type="text" id="userSearch" placeholder="Search username to chat...">
        </div>
    </div>

    <div id="guestUI">
        <h2 style="color: var(--denex-dark); font-weight:800; font-size: 28px;">Denex</h2>
        <p style="color: var(--denex-gray); font-weight: 500;">Login to start chatting with friends.</p>
        <button class="btn-login" onclick="location.href='login.html'">Login Now</button>
    </div>

    <div id="empty-state">
        <div class="d-container">
            <div class="d-symbol">D</div>
            <div class="hand-wave">👋</div>
        </div>
        <h3 style="margin:0; font-weight:800;">Welcome to Denex!</h3>
        <p style="opacity: 0.6; font-size: 15px; margin-top: 10px;">Search a friend to start chatting</p>
    </div>

    <div id="chatList"></div>

    <script>
        /* LOGIC - PRESERVED EXACTLY AS PROVIDED */
        const me = JSON.parse(localStorage.getItem('denex_user'));
        const alertBox = document.getElementById('denexAlert');
        const dropdown = document.getElementById('userDropdown');
        const chatListDiv = document.getElementById('chatList');
        const emptyState = document.getElementById('empty-state');
        const confirmModal = document.getElementById('confirmModal');

        let _supa;
        let typingTimers = {}; // Track typing state for different users

        if (typeof DENEX_CONFIG !== 'undefined') {
            _supa = supabase.createClient(DENEX_CONFIG.SB_URL, DENEX_CONFIG.SB_KEY);
        }

        async function initPage() {
            if (!me) {
                document.getElementById('appBody').classList.add('guest-mode');
                document.getElementById('topProfile').style.display = 'none';
                emptyState.style.display = 'none';
                return;
            }
            
            document.getElementById('headUname').innerText = "@" + me.username;
            if(me.avatar_url) document.getElementById('headAvatar').src = me.avatar_url;
            
            loadRecentChats();
            updateMyStatus();
            setInterval(updateMyStatus, 30000); 

            _supa.channel('denex_global')
                .on('postgres_changes', { event: '*', table: 'denex_messages' }, (payload) => {
                    if (payload.new.receiver_id === me.id || payload.new.sender_id === me.id) {
                        loadRecentChats();
                    }
                })
                .on('broadcast', { event: 'typing' }, (payload) => {
                    handleGlobalTyping(payload.payload.sender_id);
                })
                .subscribe();
        }

        // --- TYPING DETECTION LOGIC ---
        function handleGlobalTyping(senderId) {
            const msgEl = document.getElementById(`last-msg-${senderId}`);
            if (msgEl) {
                const originalText = msgEl.innerText;
                msgEl.innerText = "....typing(italic font style)";
                msgEl.classList.add('is-typing');
                
                clearTimeout(typingTimers[senderId]);
                typingTimers[senderId] = setTimeout(() => {
                    msgEl.classList.remove('is-typing');
                    msgEl.innerText = originalText;
                }, 3000);
            }
        }

        async function updateMyStatus() {
            if (!me) return;
            await _supa.from('denex_profiles').update({ last_login: new Date().toISOString() }).eq('id', me.id);
        }

        async function loadRecentChats() {
            const { data: blocks } = await _supa.from('denex_blocks')
                .select('blocker_id, blocked_id')
                .or(`blocker_id.eq.${me.id},blocked_id.eq.${me.id}`);
            
            const blockedIds = blocks ? blocks.map(b => b.blocker_id === me.id ? b.blocked_id : b.blocker_id) : [];

            const { data: messages } = await _supa.from('denex_messages')
                .select('sender_id, receiver_id, content, created_at, is_read')
                .or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`)
                .order('created_at', { ascending: false });

            if (!messages || messages.length === 0) {
                emptyState.style.display = 'flex';
                chatListDiv.style.display = 'none';
                return;
            }

            const usersMap = new Map();
            messages.forEach(m => {
                const otherId = m.sender_id === me.id ? m.receiver_id : m.sender_id;
                if (blockedIds.includes(otherId)) return;
                if (!usersMap.has(otherId)) {
                    usersMap.set(otherId, {
                        lastMsg: m.content || "📷 Image",
                        unread: (m.receiver_id === me.id && !m.is_read)
                    });
                }
            });

            if (usersMap.size === 0) {
                emptyState.style.display = 'flex';
                chatListDiv.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            chatListDiv.style.display = 'block';
            chatListDiv.innerHTML = '';

            let delay = 0;
            for (const [uid, info] of usersMap) {
                const { data: u } = await _supa.from('denex_profiles').select('*').eq('id', uid).single();
                if(!u) continue;

                const isOnline = (new Date() - new Date(u.last_login)) / 1000 / 60 < 2;

                const item = document.createElement('div');
                item.className = 'chat-item';
                item.style.animationDelay = `${delay}s`;
                delay += 0.06;
                
                let pressTimer;
                item.onpointerdown = () => {
                    pressTimer = window.setTimeout(() => handleLongPress(u.id, u.first_name), 800);
                };
                item.onpointerup = () => clearTimeout(pressTimer);
                item.onpointerleave = () => clearTimeout(pressTimer);

                item.onclick = () => {
                    _supa.from('denex_messages').update({ is_read: true }).eq('sender_id', uid).eq('receiver_id', me.id);
                    location.href = `chat.html?chat_id=${u.id}&username=${u.username}`;
                };

                item.innerHTML = `
                    <div class="pfp-wrap">
                        <img src="${u.avatar_url || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
                        <div class="online-status ${isOnline ? 'active' : ''}"></div>
                        <div class="unread-dot" style="display: ${info.unread ? 'block' : 'none'}"></div>
                    </div>
                    <div class="chat-info">
                        <h4>${u.first_name}</h4>
                        <p id="last-msg-${u.id}">${info.lastMsg}</p>
                    </div>
                `;
                chatListDiv.appendChild(item);
            }
        }

        async function handleLongPress(targetId, name) {
            document.getElementById('modalTitle').innerText = `Block ${name}?`;
            confirmModal.classList.add('active');
            document.getElementById('modalActionBtn').onclick = async () => {
                closeModal();
                popAlert("Blocking...");
                const { error } = await _supa.from('denex_blocks').insert({ blocker_id: me.id, blocked_id: targetId });
                if (!error) {
                    popAlert(`${name} removed`);
                    loadRecentChats();
                } else {
                    popAlert("Action failed");
                }
            };
        }

        function closeModal() { confirmModal.classList.remove('active'); }

        function popAlert(msg) {
            alertBox.innerText = msg;
            alertBox.classList.add('show');
            setTimeout(() => alertBox.classList.remove('show'), 2500);
        }

        function toggleMenu(e) { e.stopPropagation(); dropdown.classList.toggle('active'); }
        window.onclick = () => {
            dropdown.classList.remove('active');
            if(event.target == confirmModal) closeModal();
        };

        function handleLogout() {
            localStorage.removeItem('denex_user');
            location.href = 'login.html';
        }

        const searchInput = document.getElementById('userSearch');
        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim().toLowerCase();
                if (!me) return popAlert("Please login first");
                if (query === me.username.toLowerCase()) {
                    popAlert("Viewing profile...");
                    setTimeout(() => location.href = 'profile.html', 1000);
                    return;
                }
                popAlert("Searching...");
                const { data } = await _supa.from('denex_profiles').select('id, username, first_name').eq('username', query).maybeSingle();
                if (data) {
                    popAlert(`Found ${data.first_name}!`);
                    setTimeout(() => location.href = `chat.html?chat_id=${data.id}&username=${data.username}`, 1000);
                } else {
                    popAlert("User not found");
                }
            }
        });

        initPage();
    </script>
</body>
</html>
