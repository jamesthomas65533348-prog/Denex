<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denex - Welcome Back</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --denex-blue: #3B99FF; 
            --denex-white: #ffffff;
            --denex-red: #ff4757;
            --text-gray: #666;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* --- NATIVE FEEL & ANTI-TAP --- */
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body { 
            background: var(--denex-white); 
            margin: 0; 
            overflow-x: hidden; 
            color: #333; 
        }

        .container { 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- LOGO --- */
        .logo-wrap { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 40px; 
            animation: logoBounce 0.8s var(--spring);
        }
        @keyframes logoBounce { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .logo-bubbles { position: relative; width: 80px; height: 70px; }
        .bubble-main { 
            position: absolute; width: 55px; height: 55px; background: var(--denex-blue); 
            border-radius: 50% 50% 0 50%; display: flex; align-items: center; justify-content: center; z-index: 2;
        }
        .bubble-sub { 
            position: absolute; width: 45px; height: 45px; background: #96C9FF; 
            border-radius: 50% 50% 50% 0; bottom: 0; right: 0; opacity: 0.7; z-index: 1;
        }
        .dot { width: 6px; height: 6px; background: white; border-radius: 50%; margin: 0 2px; }
        .logo-text { font-size: 32px; font-weight: 700; color: var(--denex-blue); margin-top: 5px; letter-spacing: -1px; }

        /* --- FORM UPGRADE --- */
        .form-group { width: 100%; max-width: 380px; margin-bottom: 15px; position: relative; }
        input { 
            width: 100%; padding: 18px; padding-right: 55px; border-radius: 16px; border: 1.5px solid #eee; 
            background: #fafafa; font-size: 16px; outline: none; transition: 0.4s var(--spring);
            user-select: text; -webkit-user-select: text;
        }
        input:focus { 
            border-color: var(--denex-blue); 
            background: #fff; 
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(59,153,255,0.08); 
        }

        .eye-toggle {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            color: #ccc; cursor: pointer; font-size: 20px; transition: 0.3s;
            padding: 5px;
        }
        .eye-toggle.active { color: var(--denex-blue); }

        .login-btn {
            width: 100%; max-width: 380px; padding: 18px; background: var(--denex-blue);
            color: white; border: none; border-radius: 18px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.4s var(--spring); margin-top: 10px;
            box-shadow: 0 5px 15px rgba(59,153,255,0.2);
        }
        .login-btn:active { transform: scale(0.94); }
        .login-btn:disabled { background: #cbd5e0; box-shadow: none; transform: scale(1); }

        .footer-links { margin-top: 30px; font-size: 14px; color: var(--text-gray); text-align: center; font-weight: 500; }
        .footer-links b { color: var(--denex-blue); cursor: pointer; padding: 5px; }

        /* --- DENEX GLASS POP-UP (TOAST) --- */
        #denexToast {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(59, 153, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white; 
            padding: 16px 28px; 
            border-radius: 24px;
            z-index: 5000; 
            opacity: 0;
            visibility: hidden;
            transition: 0.4s var(--spring); 
            font-weight: 600; 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            min-width: 250px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #denexToast.show { 
            opacity: 1; 
            visibility: visible;
            transform: translate(-50%, -50%) scale(1); 
        }
    </style>
</head>
<body>

    <div id="denexToast">Message</div>

    <div class="container">
        <div class="logo-wrap">
            <div class="logo-bubbles">
                <div class="bubble-main"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="bubble-sub"></div>
            </div>
            <div class="logo-text">Denex</div>
            <p style="color:var(--text-gray); margin-top: 8px; font-weight: 500;">Welcome back!</p>
        </div>

        <div class="form-group">
            <input type="email" id="loginEmail" placeholder="Email Address">
        </div>
        
        <div class="form-group">
            <input type="password" id="loginPass" placeholder="Password">
            <i class="fa-solid fa-eye eye-toggle" id="eyeIcon" onclick="togglePass()"></i>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">Login to Account</button>

        <div class="footer-links">
            Don't have an account? <b onclick="location.href='register.html'">Join Denex</b>
        </div>
    </div>

    <script>
        /* LOGIC REMAINS COMPLETELY UNTOUCHED */
        const toast = document.getElementById('denexToast');
        
        let _supa;
        if (typeof DENEX_CONFIG !== 'undefined') {
            _supa = supabase.createClient(DENEX_CONFIG.SB_URL, DENEX_CONFIG.SB_KEY);
        }

        function denexAlert(msg, isError = true) {
            toast.innerText = msg;
            toast.style.background = isError ? "rgba(255, 71, 87, 0.92)" : "rgba(59, 153, 255, 0.92)";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function togglePass() {
            const passInput = document.getElementById('loginPass');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
                eyeIcon.classList.add('active');
            } else {
                passInput.type = "password";
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
                eyeIcon.classList.remove('active');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !pass) return denexAlert("Please fill in all fields.");

            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const { data: user, error } = await _supa
                    .from('denex_profiles')
                    .select('*')
                    .eq('email', email)
                    .eq('password', pass)
                    .maybeSingle();

                if (error) throw error;

                if (user) {
                    denexAlert("Login Successful!", false);
                    localStorage.setItem('denex_user', JSON.stringify(user));
                    setTimeout(() => { location.href = 'index.html'; }, 1500);
                } else {
                    denexAlert("Invalid email or password.");
                    btn.disabled = false;
                    btn.innerText = "Login to Account";
                }

            } catch (err) {
                denexAlert("Connection failed.");
                btn.disabled = false;
                btn.innerText = "Login to Account";
            }
        }
    </script>
</body>
</html>
