<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denex - Welcome Back</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --denex-blue: #3B99FF; 
            --denex-white: #ffffff;
            --denex-red: #ff4757;
            --text-gray: #666;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--denex-white); margin: 0; overflow-x: hidden; color: #333; }

        .container { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* --- LOGO --- */
        .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
        .logo-bubbles { position: relative; width: 80px; height: 70px; }
        .bubble-main { 
            position: absolute; width: 55px; height: 55px; background: var(--denex-blue); 
            border-radius: 50% 50% 0 50%; display: flex; align-items: center; justify-content: center; z-index: 2;
        }
        .bubble-sub { 
            position: absolute; width: 45px; height: 45px; background: #96C9FF; 
            border-radius: 50% 50% 50% 0; bottom: 0; right: 0; opacity: 0.7; z-index: 1;
        }
        .dot { width: 6px; height: 6px; background: white; border-radius: 50%; margin: 0 2px; }
        .logo-text { font-size: 32px; font-weight: 700; color: var(--denex-blue); margin-top: 5px; letter-spacing: -1px; }

        /* --- FORM --- */
        .form-group { width: 100%; max-width: 380px; margin-bottom: 15px; position: relative; }
        input { 
            width: 100%; padding: 18px; padding-right: 50px; border-radius: 16px; border: 1.5px solid #eee; 
            background: #fafafa; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--denex-blue); background: #fff; box-shadow: 0 5px 15px rgba(59,153,255,0.05); }

        /* --- EYE ICON --- */
        .eye-toggle {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            color: #ccc; cursor: pointer; font-size: 18px; transition: 0.3s;
        }
        .eye-toggle.active { color: var(--denex-blue); }

        .login-btn {
            width: 100%; max-width: 380px; padding: 18px; background: var(--denex-blue);
            color: white; border: none; border-radius: 18px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .login-btn:disabled { background: #cbd5e0; }

        .footer-links { margin-top: 30px; font-size: 14px; color: var(--text-gray); text-align: center; }
        .footer-links b { color: var(--denex-blue); cursor: pointer; }

        /* --- TOAST --- */
        #denexToast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 15px 25px; border-radius: 20px;
            z-index: 3000; transition: 0.5s var(--spring); font-weight: 600; width: 85%; text-align: center;
        }
        #denexToast.show { top: 30px; }
    </style>
</head>
<body>

    <div id="denexToast">Message</div>

    <div class="container">
        <div class="logo-wrap">
            <div class="logo-bubbles">
                <div class="bubble-main"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="bubble-sub"></div>
            </div>
            <div class="logo-text">Denex</div>
            <p style="color:var(--text-gray); margin-top: 5px;">Welcome back!</p>
        </div>

        <div class="form-group">
            <input type="email" id="loginEmail" placeholder="Email Address">
        </div>
        
        <div class="form-group">
            <input type="password" id="loginPass" placeholder="Password">
            <i class="fa-solid fa-eye eye-toggle" id="eyeIcon" onclick="togglePass()"></i>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">Login to Account</button>

        <div class="footer-links">
            Don't have an account? <b onclick="location.href='register.html'">Join Denex</b>
        </div>
    </div>

    <script>
        const toast = document.getElementById('denexToast');
        
        let _supa;
        if (typeof DENEX_CONFIG !== 'undefined') {
            _supa = supabase.createClient(DENEX_CONFIG.SB_URL, DENEX_CONFIG.SB_KEY);
        }

        function denexAlert(msg, isError = true) {
            toast.innerText = msg;
            toast.style.background = isError ? "var(--denex-red)" : "var(--denex-blue)";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- EYE TOGGLE FUNCTION ---
        function togglePass() {
            const passInput = document.getElementById('loginPass');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
                eyeIcon.classList.add('active');
            } else {
                passInput.type = "password";
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
                eyeIcon.classList.remove('active');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !pass) return denexAlert("Please fill in all fields.");

            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const { data: user, error } = await _supa
                    .from('denex_profiles')
                    .select('*')
                    .eq('email', email)
                    .eq('password', pass)
                    .maybeSingle();

                if (error) throw error;

                if (user) {
                    denexAlert("Login Successful!", false);
                    localStorage.setItem('denex_user', JSON.stringify(user));
                    setTimeout(() => { location.href = 'index.html'; }, 1500);
                } else {
                    denexAlert("Invalid email or password.");
                    btn.disabled = false;
                    btn.innerText = "Login to Account";
                }

            } catch (err) {
                denexAlert("Connection failed. Try again.");
                btn.disabled = false;
                btn.innerText = "Login to Account";
            }
        }
    </script>
</body>
</html>
