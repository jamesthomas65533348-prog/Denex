<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Denex - My Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <div id="loading"><i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--denex-blue)"></i></div>

    <div class="editor-overlay" id="editorOverlay">
        <div class="editor-container">
            <h2 style="color:white; margin-bottom:20px;">Edit Photo</h2>
            <canvas id="previewCanvas"></canvas>
            <div class="editor-tools">
                <button class="tool-btn" onclick="rotateImage()"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeEditor()">Cancel</button>
                <button class="modal-btn btn-confirm" onclick="finalUpload()">Set Profile Photo</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Notice</div>
            <div class="modal-text" id="modalText">Message goes here.</div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <i class="fa-solid fa-arrow-left" onclick="location.href='index.html'" style="cursor: pointer;"></i>
            <span>My Profile</span>
        </div>
        <i class="fa-solid fa-gear" onclick="location.href='setting.html'" style="font-size: 20px; cursor: pointer;"></i>
    </header>

    <div class="profile-card">
        <div class="avatar-container">
            <div class="avatar-main" id="profileAvatar">?</div>
            <div class="avatar-actions">
                <div id="btnDeletePhoto" class="action-btn delete-btn" onclick="askDeletePhoto()">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
                <label for="avatarInput" class="action-btn edit-btn">
                    <i class="fa-solid fa-camera"></i>
                </label>
            </div>
            <input type="file" id="avatarInput" hidden accept="image/*" onchange="openEditor(this)">
        </div>
        
        <div class="info-group">
            <label>First Name</label>
            <input type="text" id="firstName" class="input-field" spellcheck="false" placeholder="Enter first name" oninput="checkChanges()">
        </div>
        <div class="info-group">
            <label>Last Name</label>
            <input type="text" id="lastName" class="input-field" spellcheck="false" placeholder="Enter last name" oninput="checkChanges()">
        </div>
        <div class="info-group">
            <label>Username</label>
            <input type="text" id="username" class="input-field" placeholder="@username" style="text-transform: lowercase;" spellcheck="false" oninput="checkChanges()">
        </div>
        <div class="info-group">
            <label>Email (Permanent)</label>
            <input type="text" id="email" class="input-field" disabled>
        </div>

        <button id="saveBtn" class="save-btn" onclick="updateProfile()">Save Changes</button>
    </div>

    <div style="padding: 0 20px; font-size: 13px; color: var(--denex-gray); font-weight: 700; text-transform: uppercase; margin-top: 25px;">Blocked Users</div>
    <div class="block-list" id="blockList"></div>

    <script src="profile.js"></script>
</body>
</html>
