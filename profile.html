<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Denex - My Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --denex-blue: #3B99FF; 
            --denex-bg: #f0f2f5; 
            --denex-gray: #8e8e93;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1); 
        }

        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            -webkit-user-select: none;
            user-select: none;
        }

        input { -webkit-user-select: text !important; user-select: text !important; }

        body { background: var(--denex-bg); margin: 0; padding-bottom: 50px; overflow-x: hidden; }

        header { 
            background: var(--denex-blue); color: white; padding: 15px; 
            padding-top: calc(15px + env(safe-area-inset-top));
            display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 100; 
        }
        .header-left { display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: 600; }

        /* --- ANIMATIONS --- */
        @keyframes slideInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .profile-card { 
            background: white; margin: 20px 15px; padding: 25px; border-radius: 20px; 
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            animation: slideInUp 0.5s var(--spring);
        }

        .block-list { 
            background: white; margin: 10px 15px; border-radius: 15px; overflow: hidden; 
            animation: slideInUp 0.6s var(--spring);
        }

        /* --- AVATAR FIXES --- */
        .avatar-container { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .avatar-main { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #eee; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--denex-blue); font-weight: bold; overflow: hidden; }
        
        .avatar-actions { position: absolute; bottom: 0; right: -5px; display: flex; gap: 5px; }
        .action-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white; cursor: pointer; color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.2s var(--spring); }
        .action-btn:active { transform: scale(0.8); }
        .edit-btn { background: var(--denex-blue); }
        .delete-btn { background: #ff4757; display: none; } 

        /* --- INFO FIELD ARRANGEMENT --- */
        .info-group { text-align: left; margin-bottom: 15px; position: relative; }
        .info-group label { font-size: 12px; color: var(--denex-gray); font-weight: 600; margin-left: 5px; display: block; margin-bottom: 4px; }
        .input-field { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; outline: none; background: #fdfdfd; transition: border-color 0.3s; -webkit-appearance: none; }
        .input-field:focus { border-color: var(--denex-blue); }
        .input-field:disabled { background: #f5f5f5; color: #999; }

        .save-btn { background: var(--denex-blue); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; margin-top: 10px; transition: transform 0.1s; }
        .save-btn:active { transform: scale(0.97); opacity: 0.9; }

        /* --- BLOCKED USER LIST FIX --- */
        .blocked-user { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #eee; transition: background 0.2s; }
        .blocked-user:active { background: #f0f0f0; }
        .blocked-user:last-child { border: none; }
        .blocked-content { display: flex; align-items: center; gap: 12px; flex: 1; }

        /* --- MODALS --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(3px); }
        .modal-box { background: white; width: 85%; max-width: 300px; border-radius: 20px; padding: 25px; text-align: center; animation: modalBounce 0.4s var(--spring); }
        @keyframes modalBounce { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-title { font-weight: 700; font-size: 18px; margin-bottom: 10px; color: #1a1a1a; }
        .modal-text { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; font-size: 15px; transition: opacity 0.2s; }
        .modal-btn:active { opacity: 0.7; }
        .btn-cancel { background: #f0f0f0; color: #333; }
        .btn-confirm { background: var(--denex-blue); color: white; }

        #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

    <div id="loading"><i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--denex-blue)"></i></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Notice</div>
            <div class="modal-text" id="modalText">Message goes here.</div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <i class="fa-solid fa-arrow-left" onclick="location.href='index.html'" style="cursor: pointer;"></i>
            <span>My Profile</span>
        </div>
        <i class="fa-solid fa-gear" onclick="location.href='setting.html'" style="font-size: 20px; cursor: pointer;"></i>
    </header>

    <div class="profile-card">
        <div class="avatar-container">
            <div class="avatar-main" id="profileAvatar">?</div>
            <div class="avatar-actions">
                <div id="btnDeletePhoto" class="action-btn delete-btn" onclick="askDeletePhoto()">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
                <label for="avatarInput" class="action-btn edit-btn">
                    <i class="fa-solid fa-camera"></i>
                </label>
            </div>
            <input type="file" id="avatarInput" hidden accept="image/*" onchange="uploadAvatar(this)">
        </div>
        
        <div class="info-group">
            <label>First Name</label>
            <input type="text" id="firstName" class="input-field" spellcheck="false" placeholder="Enter first name">
        </div>
        <div class="info-group">
            <label>Last Name</label>
            <input type="text" id="lastName" class="input-field" spellcheck="false" placeholder="Enter last name">
        </div>
        <div class="info-group">
            <label>Username</label>
            <input type="text" id="username" class="input-field" placeholder="@username" style="text-transform: lowercase;" spellcheck="false">
        </div>
        <div class="info-group">
            <label>Email (Permanent)</label>
            <input type="text" id="email" class="input-field" disabled>
        </div>

        <button class="save-btn" onclick="updateProfile()">Save Changes</button>
    </div>

    <div style="padding: 0 20px; font-size: 13px; color: var(--denex-gray); font-weight: 700; text-transform: uppercase; margin-top: 25px;">Blocked Users</div>
    <div class="block-list" id="blockList"></div>

    <script>
        const _supa = supabase.createClient(DENEX_CONFIG.SB_URL, DENEX_CONFIG.SB_KEY);
        let me = JSON.parse(localStorage.getItem('denex_user'));
        let currentAvatarUrl = null;

        function showPopup(title, text, type = 'alert', onConfirm = null) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            const actions = document.getElementById('modalActions');
            actions.innerHTML = '';

            if (type === 'confirm') {
                const btnCancel = document.createElement('button');
                btnCancel.className = 'modal-btn btn-cancel';
                btnCancel.innerText = 'Cancel';
                btnCancel.onclick = () => overlay.style.display = 'none';
                
                const btnConfirm = document.createElement('button');
                btnConfirm.className = 'modal-btn btn-confirm';
                btnConfirm.innerText = 'Confirm';
                btnConfirm.onclick = () => { overlay.style.display = 'none'; if(onConfirm) onConfirm(); };
                actions.append(btnCancel, btnConfirm);
            } else {
                const btnOk = document.createElement('button');
                btnOk.className = 'modal-btn btn-confirm';
                btnOk.innerText = 'OK';
                btnOk.onclick = () => overlay.style.display = 'none';
                actions.append(btnOk);
            }
            overlay.style.display = 'flex';
        }

        async function loadProfile() {
            if(!me) return location.href = 'login.html';
            toggleLoading(true);
            const { data: user } = await _supa.from('denex_profiles').select('*').eq('id', me.id).single();
            toggleLoading(false);

            if(user) {
                document.getElementById('firstName').value = user.first_name || "";
                document.getElementById('lastName').value = user.last_name || "";
                document.getElementById('username').value = user.username || "";
                document.getElementById('email').value = user.email || "";
                
                const avatarDiv = document.getElementById('profileAvatar');
                const deleteBtn = document.getElementById('btnDeletePhoto');
                
                if(user.avatar_url) {
                    currentAvatarUrl = user.avatar_url;
                    avatarDiv.innerHTML = `<img src="${user.avatar_url}" style="width:100%; height:100%; object-fit:cover;">`;
                    deleteBtn.style.display = 'flex';
                } else {
                    currentAvatarUrl = null;
                    avatarDiv.innerText = user.first_name ? user.first_name[0].toUpperCase() : '?';
                    deleteBtn.style.display = 'none';
                }
                loadBlocks();
            }
        }

        async function uploadAvatar(input) {
            const file = input.files[0];
            if(!file) return;
            toggleLoading(true);
            const fileExt = file.name.split('.').pop();
            const fileName = `${me.id}/avatar_${Date.now()}.${fileExt}`;
            const { data, error } = await _supa.storage.from('avatars').upload(fileName, file, { upsert: true });
            
            if(data) {
                const { data: { publicUrl } } = _supa.storage.from('avatars').getPublicUrl(fileName);
                await _supa.from('denex_profiles').update({ avatar_url: publicUrl }).eq('id', me.id);
                location.reload();
            } else {
                showPopup("Error", error.message);
            }
            toggleLoading(false);
        }

        function askDeletePhoto() {
            showPopup("Remove Photo", "Are you sure you want to delete your profile picture?", "confirm", deleteAvatar);
        }

        async function deleteAvatar() {
            toggleLoading(true);
            const { error: dbError } = await _supa.from('denex_profiles').update({ avatar_url: null }).eq('id', me.id);
            if(!dbError) {
                if(currentAvatarUrl) {
                    const path = currentAvatarUrl.split('/public/avatars/')[1];
                    if(path) await _supa.storage.from('avatars').remove([path]);
                }
                location.reload();
            }
            toggleLoading(false);
        }

        async function updateProfile() {
            const first_name = document.getElementById('firstName').value.trim();
            const last_name = document.getElementById('lastName').value.trim();
            const username = document.getElementById('username').value.trim().replace('@','').toLowerCase();

            if(!first_name || !last_name) return showPopup("Incomplete", "Names cannot be empty.");

            toggleLoading(true);
            const { error } = await _supa.from('denex_profiles').update({ first_name, last_name, username }).eq('id', me.id);
            toggleLoading(false);
            
            if(!error) {
                showPopup("Saved", "Profile updated successfully!");
                me.first_name = first_name;
                localStorage.setItem('denex_user', JSON.stringify(me));
            } else {
                showPopup("Error", "Could not update profile. Username might be taken.");
            }
        }

        async function loadBlocks() {
            const { data: blocks } = await _supa.from('denex_blocks')
                .select('id, blocked_id, denex_profiles!blocked_id(first_name, last_name)')
                .eq('blocker_id', me.id);

            const container = document.getElementById('blockList');
            container.innerHTML = (blocks && blocks.length > 0) ? '' : '<p style="padding:20px; text-align:center; color:var(--denex-gray); font-size: 14px;">No blocked users</p>';

            if(blocks) {
                blocks.forEach((b, i) => {
                    const p = b.denex_profiles;
                    const div = document.createElement('div');
                    div.className = 'blocked-user';
                    div.style.animationDelay = `${(i * 0.05)}s`;
                    div.innerHTML = `
                        <div class="blocked-content">
                            <div class="avatar-main" style="width:40px; height:40px; font-size:16px;">${p.first_name[0]}</div>
                            <div style="font-weight:600; color: #1a1a1a;">${p.first_name} ${p.last_name}</div>
                        </div>
                        <i class="fa-solid fa-unlock" style="color:var(--denex-blue); font-size: 18px;"></i>
                    `;
                    div.onclick = () => showPopup("Unblock", `Do you want to unblock ${p.first_name}?`, "confirm", () => unblock(b.id));
                    container.appendChild(div);
                });
            }
        }

        async function unblock(id) {
            await _supa.from('denex_blocks').delete().eq('id', id);
            loadBlocks();
        }

        function toggleLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }

        loadProfile();
    </script>
</body>
</html>
